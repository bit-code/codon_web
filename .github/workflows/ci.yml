name: CodonWeb CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Suite (Ubuntu 22.04)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            make \
            curl \
            libpq-dev \
            liburing-dev \
            python3 \
            python3-jinja2

      - name: Install Codon Compiler
        run: |
          /bin/bash -c "$(curl -fsSL https://exaloop.io/install.sh)"
          echo "$HOME/.codon/bin" >> $GITHUB_PATH

      - name: Verify Environment
        run: |
          gcc --version
          $HOME/.codon/bin/codon --version

      - name: Build Native C Extensions
        run: |
          make native

      - name: Verify Code-First AOT Schema Pipeline
        run: |
          make codegen

      - name: Run Core Integration Tests
        run: |
          make test

      - name: Run Schema Tests
        run: |
          make test-schema

      - name: Run Distributed TaskQ Tests
        run: |
          make test-taskq
          make test-async-taskq
          make test-cancellation

      - name: Run Full CodonWeb 33-Test Suite
        run: |
          make test-all
